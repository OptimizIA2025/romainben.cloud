server {
    listen 80;
    server_name romainben.cloud www.romainben.cloud;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas publier la version de nginx dans l'en-tete Server.
    server_tokens off;

    # Sans charset dans l'en-tete, une bibliotheque HTTP conforme retombe sur
    # ISO-8859-1 pour tout text/*, et rend "Ã©tudiant ingÃ©nieur". Les navigateurs
    # s'en sortent grace au <meta charset> et les parseurs XML grace a leur
    # declaration, mais llms.txt n'a aucune declaration interne et il est sature
    # d'accents, pour un public fait de pipelines non-navigateur.
    charset utf-8;
    charset_types text/plain text/xml text/css application/json application/ld+json application/rss+xml application/javascript;

    # Les .gz sont fabriques a la construction de l'image (voir Dockerfile), pas
    # a chaque requete. Trois effets : compression au niveau 9 au lieu de 5,
    # aucun cycle CPU par visiteur, et surtout un Content-Length reel au lieu
    # d'une reponse en flux. Une reponse compressee a la volee part en
    # `Transfer-Encoding: chunked`, donc sans taille annoncee, ce qui empeche
    # tout outil externe de constater que le site compresse.
    gzip_static on;

    # Repli pour tout ce qui n'a pas de .gz prefabrique.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    # Par defaut nginx ne compresse pas une requete relayee par un proxy.
    # Traefik est en amont : sans cette ligne la compression peut sauter.
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Canonique : non-www -> www.
    #
    # REGLE LE 27/07/2026, la chaine fait desormais UN SEUL saut sur les quatre
    # variantes d'entree (308 puis 200, chemin preserve, en GET comme en HEAD).
    # Elle en faisait deux : le middleware Traefik `redirectscheme` ne change
    # que le schema EN GARDANT L'HOTE, donc l'apex en http partait vers l'apex
    # en https, puis seulement ici vers le www.
    #
    # Le correctif vit dans les Container Labels de Coolify, pas dans ce
    # fichier : un middleware `redirectregex` qui vise directement le domaine
    # final, applique a http-0, http-1 et https-0.
    #
    #   regex:       "^https?://(?:www\.)?romainben\.cloud/(.*)"
    #   replacement: "https://www.romainben.cloud/${1}"
    #   permanent:   true
    #
    # ATTENTION : ne jamais l'appliquer au routeur https-1, qui sert deja le
    # www en HTTPS. Il se redirigerait vers lui-meme, en boucle.
    # ATTENTION : Coolify reecrit ces labels s'il regenere sa configuration
    # (changement de domaine, "Reset Labels to Defaults"). Si la chaine repasse
    # a deux sauts sans raison apparente, c'est la qu'il faut regarder.
    #
    # Le bloc ci-dessous reste le filet si Traefik est reconfigure.
    if ($host = romainben.cloud) {
        return 301 https://www.romainben.cloud$request_uri;
    }

    # ATTENTION : en nginx, un add_header dans un bloc enfant remplace TOUS les
    # add_header herites du parent. Les en-tetes de securite sont donc repetes
    # dans chaque location qui declare les siens, sinon les assets statiques
    # seraient servis sans HSTS ni protection (c'etait le cas avant).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # 'unsafe-inline' reste necessaire : le site est en single-file, styles et
    # scripts sont inline. Un nonce imposerait une generation dynamique.
    # connect-src autorise n8n : le widget de reservation l'appelle en fetch.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://n8n.romainben.cloud; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Contact securite (RFC 9116). Declare en ^~ pour battre le blocage des
    # fichiers commencant par un point, juste en dessous.
    location ^~ /.well-known/ {
        add_header Cache-Control "public, max-age=86400" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://n8n.romainben.cloud; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }

    # Filet de securite. Le 26/07/2026, /nginx.conf, /Dockerfile et
    # /.dockerignore repondaient 200 en production : `COPY . ` recopie tout le
    # depot dans la racine web. Le .dockerignore et le `RUN rm` du Dockerfile
    # sont la vraie correction, ce bloc couvre ce qui pourrait y echapper.
    location ~ (^|/)\. {
        return 404;
    }
    location ~* ^/(Dockerfile|nginx\.conf|docker-compose\.ya?ml|package(-lock)?\.json)$ {
        return 404;
    }

    location ~* \.(webp|jpe?g|png|gif|svg|ico|css|js|woff2|woff|ttf)$ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://n8n.romainben.cloud; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }

    # Fichiers lus par les moteurs et les crawlers IA : ils changent a chaque
    # mise a jour de contenu, un cache d'un an les figerait.
    location ~* ^/(robots\.txt|sitemap\.xml|rss\.xml|llms\.txt|profile\.jsonld|ai-index\.json|entities\.json)$ {
        # L'extension .jsonld n'existe pas dans la table mime.types de nginx :
        # sans cette ligne le fichier sort en application/octet-stream, donc
        # sans charset (charset_types ne peut pas s'y appliquer) et telecharge
        # au lieu d'etre lu. Mesure le 11/08/2026 avant correctif.
        # default_type ne s'applique qu'aux extensions absentes de la table :
        # les .txt, .xml et .json de cette meme location gardent leur type.
        default_type application/ld+json;

        add_header Cache-Control "public, max-age=3600" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://n8n.romainben.cloud; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }

    # Les pages HTML n'ont pas d'empreinte dans leur nom, contrairement aux
    # assets : un cache long servirait une version perimee apres deploiement.
    # no-cache ne veut pas dire "ne pas stocker" mais "revalider avant de
    # servir" : le navigateur garde la page et l'Etag deja emis repond 304
    # tant qu'elle n'a pas change, donc rien n'est retelecharge pour rien.
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control "no-cache" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://n8n.romainben.cloud; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    }
}
