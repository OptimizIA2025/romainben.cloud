version: 2

# Une seule chose de ce depot est une dependance au sens de Dependabot :
# le `FROM nginx:...-alpine` du Dockerfile. Les polices, GSAP et ScrollTrigger
# sont versionnes en clair dans le depot sans manifeste, donc invisibles pour
# lui : leur mise a jour reste manuelle.
#
# Docker n'est couvert que par les *version updates*, pas par les alertes de
# securite : aucune CVE nginx ne remontera ici, seules les montees de version
# de l'image de base sont proposees.
#
# ATTENTION avant de fusionner une PR de montee nginx : il n'y a aucune CI et
# le webhook Coolify deploie des la fusion sur `main`. Or `gzip_static` exige
# que l'image soit compilee avec --with-http_gzip_static_module. Si une image
# future le perdait, nginx refuserait de demarrer et le site tomberait sans
# etape intermediaire. Construire l'image en local avant de fusionner.

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
